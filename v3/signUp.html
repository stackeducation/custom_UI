<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);

            const queryTheme = params.get("theme");

            const savedTheme = localStorage.getItem("b2c_theme");

            const systemTheme = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches
                ? "dark"
                : "light";

            const theme =
                queryTheme ||
                savedTheme ||
                systemTheme ||
                "light";

            localStorage.setItem("b2c_theme", theme);

            document.documentElement.setAttribute("data-theme", theme);

            if (theme === "dark") {
                document.documentElement.classList.add("dark");
            } else {
                document.documentElement.classList.remove("dark");
            }
        })();
    </script>

    <style>
        :root {
            color-scheme: light;

            --page-bg: #F8F7F5;
            --card-bg: #ffffff;
            --card-border: #f5a631;
            --card-border-light: #FFD089;
            --angle: 0deg;

            --text-primary: #111111;
            --text-secondary: #3c372f;
            --text-tertiary: #6b6560;
            --text-disabled: #a3a3a3;

            --navy: #094074;

            --input-border: #c8c5be;

            --button-disabled: #e1dfd9;

            --input-bg: #ffffff;
            --primary-button-text: #ffffff;
            --error-text: #b00020;
            --shadow-color: rgba(245, 166, 49, 0.12);
            --autofill-bg: #ffffff;
        }

:root[data-theme="dark"] {
            color-scheme: dark;

            --page-bg: #0F1115;
            --card-bg: #1F1F1F;
            --card-border: #f5a631;
            --card-border-light: #FFD089;

            --text-primary: #EDEDED;
            --text-secondary: #A3A3A3;
            --text-tertiary: #C7C7C7;
            --text-disabled: #8A8A8A;

            --navy: #5899D6;

            --input-border: #333333;

            --button-disabled: #2C2C2C;

            --input-bg: #1F1F1F;
            --primary-button-text: #07182A;
            --error-text: #ff8a8a;
            --shadow-color: rgba(245, 166, 49, 0.16);
            --autofill-bg: #101318;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", "DM Sans", "Segoe UI", Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.42857143;
            color: var(--text-primary);
            background: var(--page-bg) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .page {
            display: flex;
            justify-content: center;
            padding: 100px 20px;
        }

        .card {
            position: relative;
            width: 565px;
            max-width: 92vw;
            padding: 56px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            background:
                linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                conic-gradient(from var(--border-angle),
                    transparent 0deg,
                    transparent 220deg,
                    rgba(245, 166, 49, 0.12) 250deg,
                    rgba(255, 208, 137, 0.45) 270deg,
                    #fff4df 285deg,
                    var(--card-border-light) 300deg,
                    var(--card-border) 320deg,
                    var(--card-border) 340deg,
                    rgba(245, 166, 49, 0.25) 350deg,
                    transparent 360deg) border-box;
            border: 1.5px solid transparent;
            box-shadow: 0 0 20.5714px var(--shadow-color);
            animation: border-angle-rotate 5s linear infinite;
        }

        @property --border-angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes border-angle-rotate {
            from {
                --border-angle: 0deg;
            }

            to {
                --border-angle: 360deg;
            }
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            height: 48px;
        }

        .custom-heading {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .custom-heading h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: lowercase;
        }

        .custom-heading p {
            margin: 0;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .form-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .footer {
            position: absolute;
            bottom: 15px;
            text-align: center;
            color: var(--text-disabled);
            font-size: 12px;
        }

        .extension_tenantName_li,
        .extension_userRole_li,
        .extension_documentSources_li,
        .displayName_li,
        .extension_displayName_li {
            display: none;
        }

        .intro,
        .heading,
        .divider,
        .helpLink,
        .attrEntry .verificationSuccessText,
        .entry .working,
        .verifying-modal,
        /* .buttons:last-child, */
        #api>.buttons {
            display: none !important;
        }

        #api {
            width: 100%;
        }


        #attributeList ul,
        .entry,
        #localAccountForm .entry .entry-item {
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .entry {
            gap: 48px;
        }

        #attributeList ul .attrEntry {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0;
            width: 100%;
        }

        #attributeList ul,
        #localAccountForm .entry .entry-item {
            gap: 16px;
        }

        #attributeList ul li,
        #localAccountForm .entry .entry-item {
            list-style: none;
            margin: 0;
        }

        #attributeList ul li label,
        .entry-item label {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-primary);
        }

        #attributeList ul li input,
        .entry-item input {
            width: 100%;
            height: 40px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding: 0 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 16px;
            background: var(--input-bg);
        }

        /* Gap between a field and the button that acts on it. */
        #attributeList ul .attrEntry .buttons {
            margin-top: 24px;
        }

        .password-field {
            position: relative;
            width: 100%;
        }

        .password-field input {
            padding-right: 44px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            width: 24px;
            height: 24px;
            transform: translateY(-50%);
            border: none;
            border-radius: 4px;
            background: var(--input-bg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
        }

        .password-toggle img {
            width: 16px;
            height: 16px;
        }

        #attributeList ul li input::placeholder,
        .entry-item input::placeholder {
            color: var(--text-disabled);
        }

        #attributeList ul li input:-webkit-autofill,
        #attributeList ul li input:-webkit-autofill:hover,
        #attributeList ul li input:-webkit-autofill:focus,
        #attributeList ul li input:-webkit-autofill:active,
        .entry-item input:-webkit-autofill,
        .entry-item input:-webkit-autofill:hover,
        .entry-item input:-webkit-autofill:focus,
        .entry-item input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px var(--autofill-bg) inset !important;
            box-shadow: 0 0 0 1000px var(--autofill-bg) inset !important;

            -webkit-text-fill-color: var(--text-primary) !important;

            caret-color: var(--text-primary) !important;

            font-size: 16px !important;

            transition: background-color 9999s ease-in-out 0s;

            border-radius: 4px;
        }

        #localAccountForm .error,
        #api #attributeVerification .error {
            color: var(--error-text);
            text-align: left;
            margin: 0;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 24px;
        }


        .buttons button {
            width: 100%;
            height: 48px;
            font-family: inherit;
            border-radius: 6px;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .sendNewCode,
        .changeClaims {
            background: var(--navy);
            color: var(--primary-button-text);
            cursor: pointer;
        }

        #cancel {
            display: none;
        }

        .resend-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            font-size: 14px;
            color: var(--text-tertiary);
        }

        .resend-helper {
            color: var(--text-tertiary);
        }

        .resend-link {
            background: none;
            border: none;
            padding: 0;
            color: var(--navy);
            font-size: 12px;
            font-weight: 500;
            height: max-content !important;
            text-transform: lowercase !important;
            width: max-content !important;
            cursor: pointer;
        }

        /* 6 digit verification code UI */
        #attributeList ul li .verification-code-wrapper,
        .verification-code-wrapper {
            display: grid !important;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            width: 100%;
            margin-top: 4px;
        }

        #attributeList ul li .verification-code-wrapper input.verification-code-box,
        .verification-code-wrapper input.verification-code-box {
            width: 100% !important;
            min-width: 0 !important;
            max-width: none !important;
            height: 48px !important;
            padding: 0 !important;
            text-align: center;
            font-size: 20px !important;
            font-weight: 400;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        #attributeList ul li .verification-code-wrapper input.verification-code-box:focus,
        .verification-code-wrapper input.verification-code-box:focus {
            outline: none;
            border-color: var(--navy);
            box-shadow: 0 0 0 1px var(--navy);
        }

        #emailVerificationCode.custom-hidden-verification-input {
            display: none !important;
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 24px;
            }
        }
    </style>
    <script defer>
        function customizeB2CUI() {
            const getThemeColor = (name) =>
                getComputedStyle(document.documentElement)
                    .getPropertyValue(name)
                    .trim();

            const signUpButton = document.getElementById('continue');
            if (signUpButton) {
                signUpButton.textContent = 'Sign Up';
            }


            const emailInput = document.getElementById("email");
            const verificationCodeInput = document.getElementById("emailVerificationCode");
            const newPasswordInput = document.getElementById("newPassword");
            const confirmPasswordInput = document.getElementById("reenterPassword");
            const sendCodeButton = document.getElementById("emailVerificationControl_but_send_code");
            const verifyCodeButton = document.getElementById("emailVerificationControl_but_verify_code");
            const resendCodeButton = document.getElementById("emailVerificationControl_but_send_new_code");
            const changeClaimsButton = document.getElementById("emailVerificationControl_but_change_claims");

            const verificationCodeLabel = document.querySelector("label[for='emailVerificationCode']");

            if (verificationCodeLabel) {
                verificationCodeLabel.textContent = "Enter and Verify 6-digit code";
            }

            if (verifyCodeButton) {
                verifyCodeButton.textContent = "Verify";
            }

            if (resendCodeButton) {
                resendCodeButton.textContent = "Resend code";
            }

            if (verifyCodeButton && resendCodeButton && !resendCodeButton.dataset.repositioned) {
                const resendRow = document.createElement("div");
                resendRow.className = "resend-row";

                const helperText = document.createElement("span");
                helperText.className = "resend-helper";
                helperText.textContent = "Didn't receive the code?";

                resendCodeButton.classList.add("resend-link");

                resendRow.appendChild(helperText);
                resendRow.appendChild(resendCodeButton);
                verifyCodeButton.parentNode.insertBefore(resendRow, verifyCodeButton);
                resendCodeButton.dataset.repositioned = "true";
            }

            const attachPasswordToggle = (input) => {
                if (!input || input.dataset.toggleAttached) {
                    return;
                }

                const wrapper = document.createElement("div");
                wrapper.className = "password-field";

                const toggleButton = document.createElement("button");
                toggleButton.type = "button";
                toggleButton.className = "password-toggle";
                toggleButton.setAttribute("aria-label", "Show password");
                toggleButton.innerHTML =
                    "<img src='https://stackeducation.github.io/custom_UI/v3/eye-open-icon.svg' alt='' aria-hidden='true' />";

                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);
                wrapper.appendChild(toggleButton);

                toggleButton.addEventListener("click", () => {
                    const isHidden = input.type === "password";
                    input.type = isHidden ? "text" : "password";
                    toggleButton.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
                    const icon = toggleButton.querySelector("img");
                    if (icon) {
                        icon.src = isHidden
                            ? "https://stackeducation.github.io/custom_UI/v3/eye-closed-icon.svg"
                            : "https://stackeducation.github.io/custom_UI/v3/eye-open-icon.svg";
                    }
                });

                input.dataset.toggleAttached = "true";
            };

            attachPasswordToggle(newPasswordInput);
            attachPasswordToggle(confirmPasswordInput);

            const attachSixDigitVerificationCode = () => {
                const realInput = document.getElementById("emailVerificationCode");

                if (!realInput || realInput.dataset.sixDigitAttached) {
                    return;
                }

                realInput.dataset.sixDigitAttached = "true";
                realInput.classList.add("custom-hidden-verification-input");

                realInput.setAttribute("maxlength", "6");
                realInput.setAttribute("inputmode", "numeric");
                realInput.setAttribute("autocomplete", "one-time-code");

                const wrapper = document.createElement("div");
                wrapper.className = "verification-code-wrapper";
                wrapper.setAttribute("aria-label", "Enter 6 digit verification code");

                const boxes = [];

                for (let i = 0; i < 6; i++) {
                    const box = document.createElement("input");

                    box.type = "text";
                    box.inputMode = "numeric";
                    box.maxLength = 1;
                    box.autocomplete = i === 0 ? "one-time-code" : "off";
                    box.className = "verification-code-box";
                    /*
                     * B2C walks the inputs inside #attributeList and looks each
                     * one up by id; an id-less input makes that lookup return
                     * null and its claim validation throws on .classList.
                     */
                    box.id = "stackVerificationDigit" + (i + 1);
                    box.setAttribute("aria-label", `Digit ${i + 1} of verification code`);

                    box.addEventListener("input", (event) => {
                        const value = event.target.value.replace(/\D/g, "");

                        event.target.value = value.slice(-1);

                        if (value && i < boxes.length - 1) {
                            boxes[i + 1].focus();
                        }

                        syncRealVerificationInput();
                    });

                    box.addEventListener("keydown", (event) => {
                        if (event.key === "Backspace" && !box.value && i > 0) {
                            boxes[i - 1].focus();
                        }

                        if (event.key === "ArrowLeft" && i > 0) {
                            boxes[i - 1].focus();
                        }

                        if (event.key === "ArrowRight" && i < boxes.length - 1) {
                            boxes[i + 1].focus();
                        }
                    });

                    box.addEventListener("paste", (event) => {
                        event.preventDefault();

                        const pastedValue = (
                            event.clipboardData || window.clipboardData
                        )
                            .getData("text")
                            .replace(/\D/g, "")
                            .slice(0, 6);

                        pastedValue.split("").forEach((digit, index) => {
                            if (boxes[index]) {
                                boxes[index].value = digit;
                            }
                        });

                        const nextIndex = Math.min(pastedValue.length, boxes.length - 1);
                        boxes[nextIndex].focus();

                        syncRealVerificationInput();
                    });

                    boxes.push(box);
                    wrapper.appendChild(box);
                }

                realInput.parentNode.insertBefore(wrapper, realInput);

                const syncRealVerificationInput = () => {
                    const code = boxes.map((box) => box.value).join("");

                    realInput.value = code;

                    realInput.dispatchEvent(new Event("input", { bubbles: true }));
                    realInput.dispatchEvent(new Event("change", { bubbles: true }));
                };
            };

            attachSixDigitVerificationCode();

            const setButtonState = (button, enabled) => {
                if (!button) {
                    return;
                }

                button.disabled = !enabled;
                button.style.backgroundColor = enabled ? getThemeColor("--navy") : getThemeColor("--button-disabled");
                button.style.color = enabled ? getThemeColor("--primary-button-text") : getThemeColor("--text-disabled");
                button.style.cursor = enabled ? "pointer" : "not-allowed";

                const resendRow = button.closest(".resend-row");
                if (resendRow) {
                    resendRow.style.display = getComputedStyle(button).display === "none" ? "none" : "flex";
                }
            };

            const updateResendRowVisibility = () => {
                if (!resendCodeButton) {
                    return;
                }

                const resendRow = resendCodeButton.closest(".resend-row");
                if (resendRow) {
                    resendRow.style.display = getComputedStyle(resendCodeButton).display === "none" ? "none" : "flex";
                }
            };

            const setPasswordSectionVisibility = (isVisible) => {
                const newPasswordItem = newPasswordInput ? newPasswordInput.closest("li") : null;
                const confirmPasswordItem = confirmPasswordInput ? confirmPasswordInput.closest("li") : null;

                if (newPasswordItem) {
                    newPasswordItem.style.display = isVisible ? "block" : "none";
                    newPasswordItem.setAttribute("aria-hidden", isVisible ? "false" : "true");
                }

                if (confirmPasswordItem) {
                    confirmPasswordItem.style.display = isVisible ? "block" : "none";
                    confirmPasswordItem.setAttribute("aria-hidden", isVisible ? "false" : "true");
                }

                if (signUpButton) {
                    signUpButton.style.display = isVisible ? "block" : "none";
                    signUpButton.setAttribute("aria-hidden", isVisible ? "false" : "true");
                }
            };

            const updatePasswordSectionVisibility = () => {
                if (!changeClaimsButton) {
                    return;
                }

                const isVerified =
                    getComputedStyle(changeClaimsButton).display !== "none" &&
                    changeClaimsButton.getAttribute("aria-hidden") !== "true";

                setPasswordSectionVisibility(isVerified);
            };

            const updateButtonState = () => {
                if (!emailInput) {
                    return;
                }
                const hasEmail = emailInput.value.trim() !== "";
                const hasCode = verificationCodeInput && /^\d{6}$/.test(verificationCodeInput.value.trim());
                const hasPasswords = newPasswordInput && confirmPasswordInput
                    ? newPasswordInput.value.trim() !== "" && confirmPasswordInput.value.trim() !== ""
                    : false;
                setButtonState(sendCodeButton, hasEmail);
                setButtonState(verifyCodeButton, hasCode);
                setButtonState(signUpButton, hasPasswords);
                updateResendRowVisibility();
            };

            const attachInputListener = (input) => {
                if (!input || input.dataset.stateListenerAttached) {
                    return;
                }

                input.addEventListener("input", updateButtonState);
                input.dataset.stateListenerAttached = "true";
            };

            attachInputListener(emailInput);
            attachInputListener(verificationCodeInput);
            attachInputListener(newPasswordInput);
            attachInputListener(confirmPasswordInput);
            updateButtonState();
            updatePasswordSectionVisibility();

            if (sendCodeButton && !sendCodeButton.dataset.visibilityListenerAttached) {
                sendCodeButton.addEventListener("click", () => {
                    setTimeout(updateResendRowVisibility, 50);
                });
                sendCodeButton.dataset.visibilityListenerAttached = "true";
            }

            if (resendCodeButton && !resendCodeButton.dataset.visibilityObserverAttached) {
                const observer = new MutationObserver(updateResendRowVisibility);
                observer.observe(resendCodeButton, {
                    attributes: true,
                    attributeFilter: ["style", "class", "aria-hidden"],
                });
                resendCodeButton.dataset.visibilityObserverAttached = "true";
            }

            if (changeClaimsButton && !changeClaimsButton.dataset.visibilityObserverAttached) {
                const observer = new MutationObserver(updatePasswordSectionVisibility);
                observer.observe(changeClaimsButton, {
                    attributes: true,
                    attributeFilter: ["style", "class", "aria-hidden"],
                });
                changeClaimsButton.dataset.visibilityObserverAttached = "true";
            }
        }

        setTimeout(customizeB2CUI, 10);
        // Backup retry
        setTimeout(customizeB2CUI, 200);
    </script>
</head>

<body>
    <main class="page">
        <section class="card">
            <div class="brand">
                <div class="logo">
                    <img class="companyLogo" data-tenant-branding-logo="true"
                        src="https://stackeducation.github.io/custom_UI/v3/stack-logo.svg" width="179" height="48"
                        alt="Company Logo">
                </div>
                <div class="custom-heading">
                    <h1>create account</h1>
                    <p>Start researching with incline today</p>
                </div>
            </div>

            <div class="form-wrapper">
                <div id="api" data-name="SelfAsserted" role="main"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        © 2026 Stack AI, Inc.
    </footer>
</body>

</html>
